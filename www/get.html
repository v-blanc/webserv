<!DOCTYPE html>
<html lang="fr">
<head>

    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #282c34;
            color: white;
            padding: 16px 0 8px 0;
        }
        header img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        main { padding: 32px 16px; max-width: 900px; margin: 0 auto; }
        h1 { margin: 18px 0 6px; }
        .card {
            background: white;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .thumb { max-width: 320px; height: auto; display:block; margin: 12px auto; border-radius: 6px; }
        a.button {
            display: inline-block;
            text-decoration: none;
            background-color: #61dafb;
            color: #000;
            padding: 12px 20px;

            margin-top: 10px;
        }

<body>
    <header>
        <!-- <img src="banner.png" alt="Webserv 42"> -->
        <h1>GET — Démo</h1>

        <div class="card">
            <h2>Télécharger une image (GET)</h2>
            <p>Cliquer sur l'image ou le bouton pour effectuer une requête <strong>GET</strong> et récupérer le fichier <code>42.png</code>.</p>

            <a href="assets/42.png" title="Télécharger l'image">

                <a class="button" href="assets/42.png" download>Télécharger l'image</a>

            <p><small>Note : le serveur doit servir <code>assets/42.png</code> depuis le même répertoire.</small></p>
        </div>

        <p><a class="button" href="index.html">← Retour</a></p>

        Webserv 42 — Démo GET

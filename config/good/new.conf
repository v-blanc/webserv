# ─────────────────────────────────────────────────────────────
#  WebServ — 42 Test Suite Configuration
#  Matches the site layout in /www:
#    /www/index.html, get.html, post.html, delete.html,
#    /www/cookies.html, cgi.html, multicgi.html
#    /www/cgi-bin/*.py
#    /www/errors/*.html
#    /www/uploads/          (writable, for DELETE lifecycle test)
#    /www/autoindex_dir/    (directory with no index, for autoindex)
# ─────────────────────────────────────────────────────────────

root /www;

# ── Error pages (relative to root) ──────────────────────────
error_page 400 errors/400.html;
error_page 403 errors/403.html;
error_page 404 errors/404.html;
error_page 405 errors/405.html;
error_page 413 errors/413.html;
error_page 500 errors/500.html;
error_page 501 errors/501.html;
error_page 504 errors/504.html;

# ── Global defaults (overridden per-server below) ────────────
client_max_body_size 420;
index index.html;
autoindex off;

# ═════════════════════════════════════════════════════════════
#  SERVER 1 — Main test server
#  Accessible on multiple addresses to test virtual hosting
# ═════════════════════════════════════════════════════════════
server {
      server_name webserv42;

      listen localhost:8080;
      listen localhost:8081;
      listen 127.0.0.42:8082;

      # Per-server body limit (overrides global 420)
      client_max_body_size 100000000;

      # ── CGI handlers for this server ──────────────────────
      cgi_handler .py /usr/bin/python3;
      cgi_handler .pl /usr/bin/perl;

      # ── Root — serves the landing page ───────────────────
      location / {
      }

      # ── Static pages (GET only) ───────────────────────────
      location /get.html {
            limit_except GET;
      }

      location /post.html {
            limit_except GET;
      }

      location /delete.html {
            limit_except GET;
      }

      location /cookies.html {
            limit_except GET;
      }

      location /cgi.html {
            limit_except GET;
      }

      location /multicgi.html {
            limit_except GET;
      }

      # ── GET-only test route (used by get.html tests) ──────
      location /get {
            limit_except GET;
      }

      # ── POST-only test route (used by post.html tests) ────
      location /post {
            limit_except POST;
      }

      # ── CGI — python & perl scripts ───────────────────────
      location /cgi-bin {
            limit_except GET POST;
            cgi_handler .py /usr/bin/python3;
            cgi_handler .pl /usr/bin/perl;
      }

      # ── Uploads — writable dir for DELETE lifecycle test ──
      #    POST creates a file, GET reads it, DELETE removes it
      location /uploads {
            limit_except GET POST DELETE;
      }

      # ── DELETE tests ──────────────────────────────────────
      #    Route that explicitly forbids DELETE (expect 405)
      location /not_allowed_delete {
            limit_except GET POST;
      }

      #    Route that allows DELETE (used by delete.html)
      location /allowed_to_delete {
            limit_except GET DELETE;
      }

      #    Resource pre-created on disk to test DELETE → 204
      location /resource-to-delete {
            limit_except DELETE;
      }

      # ── Autoindex — directory listing test ───────────────
      location /autoindex_dir {
            autoindex on;
      }

      # ── Redirections ──────────────────────────────────────
      #    Simple redirect back to root
      location /redirection {
            return /;
      }

      #    Redirect to a CGI script
      location /toto {
            return /cgi-bin/hello.py;
      }

      #    Infinite redirect loop (should return 508 or similar)
      location /loopA {
            return /loopB;
      }
      location /loopB {
            return /loopA;
      }
}

# ═════════════════════════════════════════════════════════════
#  SERVER 2 — Secondary virtual host
#  Tests that the server routes by Host header correctly
# ═════════════════════════════════════════════════════════════
server {
      listen 127.0.0.1:1234;

      server_name server2;

      client_max_body_size 1000;

      location / {
      }

      location /cgi-bin {
            limit_except GET POST;
            cgi_handler .py /usr/bin/python3;
      }
}

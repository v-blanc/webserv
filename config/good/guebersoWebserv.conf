error_page 400 /400.html;
error_page 403 /403.html;
error_page 404 /404.html;
error_page 405 /405.html;
error_page 408 /408.html;
error_page 500 /500.html;
error_page 504 /504.html;
error_page 505 /505.html;
client_max_body_size 1000000000000;

server {
    listen localhost:8080;
    server_name localhost;
    root /var/www/html;
    index index.html;

    location / {
        limit_except GET;
    }

    location /api {
        limit_except GET POST DELETE;
        root /var/www;
        index api.html;
        client_max_body_size 10000000000000000;
    }

    location /redir/ {
        return /api/;
    }

    location /documentation/ {
        index docs.html;
        limit_except GET;
        autoindex on;
    }

    location /cgi/ {
        root /var/www;
        index /cgi.html;
    }

    location /cgi-bin-py/ {
        root /var/www;
        error_page 504 /html/504.html;
        error_page 500 /html/500.html;
        error_page 403 /html/403.html;
        error_page 404 /html/404.html;
        limit_except GET POST;
        cgi_handler .py /usr/bin/python3;
    }

    location /cgi-bin-php/ {
        root /var/www;
        error_page 504 /html/504.html;
        error_page 500 /html/500.html;
        error_page 403 /html/403.html;
        error_page 404 /html/404.html;
        limit_except GET POST;
        cgi_handler .php /usr/bin/php-cgi;
        index fractal.html;
    }

    location /cgi-bin-crash/ {
        root /var/www;
        limit_except GET POST;
        error_page 504 /html/504.html;
        error_page 500 /html/500.html;
        error_page 403 /html/403.html;
        error_page 404 /html/404.html;
        cgi_handler .psdfsdf /usr/bin/wrong-binary;
    }

    location /downloads/ {
        limit_except GET;
        root /var/www;
        autoindex on;
    }

    location /upload/ {
        limit_except POST;
        upload_store /var/www/uploads;
        client_max_body_size 500000000000;
    }

    location /delete/ {
        limit_except DELETE;
    }

    location /get-only/ {
        limit_except GET;
    }

    location /small-body/ {
        limit_except POST;
        client_max_body_size 1000;
        root /var/www/html;
    }

    location /redirect-301/ {
        return /api;
    }

    location /redirect-302/ {
        return /downloads;
    }

    location /alias-test/ {
        limit_except GET;
        autoindex on;
    }
}

server {
    listen localhost:8081;
    server_name localhost2;
    root /var/www/secondary;
    index index.html;

    location / {
        limit_except GET POST;
        autoindex on;
    }
}


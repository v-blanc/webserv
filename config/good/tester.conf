root /www;
# index index.html;

server {
      server_name server1;
      listen localhost:8080;

      # 1. "/" must answer to GET request ONLY
      location / {
            limit_except GET;
      }

      # 2. Any file with .bla extension must answer to POST request
      #    by calling the cgi_test executable
      # location ~ \.bla$ {
      #       limit_except POST;
      #       cgi_pass /usr/bin/cgi_test;
      # }

      # 3. "/post_body" must answer anything to POST request with maxBody 100
      location /post_body {
            limit_except POST;
            client_max_body_size 100;
      }

      # 4. "/directory/" must answer to GET request
      #    root is YoupiBanane
      #    default file is youpi.bad_extension
      location /directory/ {
            limit_except GET;
            root /var/www/html/YoupiBanane;
            index youpi.bad_extension;
      } 
}
